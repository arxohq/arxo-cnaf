# Deontic-window data for the D. 532-1 declaration duty — DATA, not code.
# Contract: corpus/templates/deontic-window/TEMPLATE.ru.md
# Authored by hand (RETURN 2026-10-08); the rule text is generated by
# `law gen deontic-window fr.pf.paje --write` between markers (pending).
# GENERATED_OUTPUT_PENDING: the inline DevoirDeclarerGrossesse rule in
# 07-examens-medicaux.law stays until the generator writes the block.
# LIMITATION (template request, see journal): the schema carries a single
# label; the fr official quote is below, the D-12 en unofficial companion
# ("the claimant sends the pregnancy declaration within the first fourteen
# weeks — duty of the allocataire") awaits bilingual template support.

target = "07-examens-medicaux.law"

[[rule]]
name      = "DevoirDeclarerGrossesse"
strength  = "strict"
anchors   = ["CSS_D532_1_ED2004_01", "CSS_D532_1_ED2023_01"]
label     = { lang = "fr", status = "official", text = "l'allocataire adresse la déclaration de grossesse dans les quatorze premières semaines" }
params    = ["m: Menage", "e: Enfant", "o: Organisme", "debut: Date", "limite: Date"]
premises  = ["attente_naissance(m, e)", "debut_grossesse(m, e, debut)", "date_limite_declaration(m, e, limite)", "organisme_debiteur(o, m)"]
note      = "// D. 532-1, para. 1: duty of the allocataire (duty-holder m).\n"
layout    = { indent = 0, params = "inline", wrapped = false }

[rule.norm]
modality      = "duty"
name          = "DeclarerGrossesseEnDelai"
bearer        = "m"
beneficiary   = "o"
goal          = "achieve"
condition     = "declaration_grossesse_effectuee(m, e)"
start         = "debut"
start_event   = "debut_grossesse(m, e, debut)"
end           = "limite"
end_event     = "date_limite_declaration(m, e, limite)"
end_inclusive = true
