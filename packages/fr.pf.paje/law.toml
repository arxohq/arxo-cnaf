# Manifest §10 — package root marker (DECISION-0033). Normative headings per §22
# live in the .law files themselves; the manifest must match them (LDC-E1109, lawc check).
[package]
name = "fr.pf.paje"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:pf-paje"

# Explicit package (DECISION-0386, SPEC §23.2): after editing .law files run
# `law fix imports <package>`; do not maintain `use self::{…}` blocks by hand.
[authoring]
local_imports = "explicit"

[features]
enabled = ["law.params/0.1"]
semanticLayer = "L0"

# Catalog metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). NOT semantics.
[metadata]
act = "fr-pf-paje"
title = "PAJE: birth/adoption grant (L. 531-2, 229.75% / 459.5% of BMAF, wave 1) + base allowance (L. 531-3, 41.65% / 20.825%, 2018 and 2015 wordings, wave 3) + PreParE (L. 531-4, 96.62% / 157.93% / 62.46% / 36.03%, wave 3); examination of R. 531-1, duties of the fund"
primarySource = "CSS"
jurisdiction = "FR"
instrument = "code"
sourceFidelity = "pinned_official_bytes"
legalStatus = "in_force"
issuer = "République française; texte codifié (LEGI DILA)"
verifiedAgainstSource = true

# Own families (DECISION-0127): regression = false until the ratchet is registered.
[[tests]]
family = "fr.pf.paje#prime-naissance"
regression = false
suites = [
    "tests/prime-naissance-montant.lawtest",
    "tests/prime-naissance-plafond-egal.lawtest",
    "tests/prime-naissance-plafond-depasse.lawtest",
    "tests/prime-naissance-regime-ancien.lawtest",
    "tests/prime-naissance-regime-nouveau.lawtest",
    "tests/prime-naissance-deces-20-semaines.lawtest",
    "tests/prime-naissance-precoce.lawtest",
    "tests/prime-naissance-sans-examen.lawtest",
]
world = ["fr.pf.paje"]

[[tests]]
