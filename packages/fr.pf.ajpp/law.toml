# Manifest §10 — package root marker (DECISION-0033). Headers §22 in the
# .law files themselves are normative; the manifest must match them
# (LDC-E1109, lawc check).
[package]
name = "fr.pf.ajpp"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:pf-ajpp"

# Explicit package (DECISION-0386, SPEC §23.2): after .law edits run
# `law fix imports fr/pf-ajpp`; do not maintain `use self::{…}` blocks by hand.
# (FINISH nochecks round: use-self blocks are hand-maintained in this
# authoring turn by task order; no law fix imports execution.)
[authoring]
local_imports = "explicit"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). NOT semantics.
[metadata]
act = "fr-pf-ajpp"
title = "Allocation journalière de présence parentale (AJPP)"
primarySource = "CSS"
jurisdiction = "FR"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "République française"
verifiedAgainstSource = false

[features]
enabled = ["law.params/0.1"]
semanticLayer = "L0"

# Upstream premises: child in care and the debtor body are established by
# fr.pf.core. The medical/channel facts (certificate, control agreement,
# counters) are this package's own established facts (B-PFAJPP-TETE): the
# upstream principle-level filters (beneficie_ajpp, AjppPlafond310,
# NonCumulAjpp) are package-internal (§24) and cannot be read.
# Worlds below include both packages.
[dependencies]
"fr.pf.core" = "0.1.0"

# Right and duration (L544-1 boundary, L544-2): certificate + control
# agreement + parental leave open the right for the foreseeable period;
# re-exam deadlines 6/12-14 months (param). Decree durations unpinned.
[[tests]]
family = "fr.pf.ajpp#droit-duree"
regression = false
suites = [
    "tests/ajpp-droit-ouvert.lawtest",
    "tests/ajpp-droit-sans-avis.lawtest",
    "tests/ajpp-reexamen-conforme.lawtest",
    "tests/ajpp-reexamen-2026.lawtest",
]
world = ["fr.pf.ajpp", "fr.pf.core"]

# 310-day ceiling, exceptional once-renewal (2021+), reopening (L544-3).
[[tests]]
family = "fr.pf.ajpp#plafond-renouvellement"
regression = false
suites = [
    "tests/ajpp-plafond-310.lawtest",
    "tests/ajpp-depassement-310.lawtest",
    "tests/ajpp-renouvellement-unique.lawtest",
    "tests/ajpp-renouvellement-avant-2021.lawtest",
    "tests/ajpp-reouverture-rechute.lawtest",
    "tests/ajpp-avance-attente-avis.lawtest",
]
world = ["fr.pf.ajpp", "fr.pf.core"]

# Monthly cap and daily amounts (L544-4/6/7): decree figures as case inputs,
# 2023-H1 single majoration window, expense complement, special workers,
# F05-01 amount qualification (monthly/flat/cumulative/duration blocks,
# unknown history, renewal and reopening positives).
[[tests]]
family = "fr.pf.ajpp#montants"
regression = false
suites = [
    "tests/ajpp-mensuel-plafond.lawtest",
    "tests/ajpp-mensuel-depassement.lawtest",
    "tests/ajpp-montant-couple.lawtest",
    "tests/ajpp-montant-isole-2023.lawtest",
    "tests/ajpp-complement-frais.lawtest",
    "tests/ajpp-special-nonsalarie.lawtest",
    "tests/ajpp-special-demandeur-emploi.lawtest",
    "tests/ajpp-special-formation.lawtest",
    "tests/ajpp-special-vrp.lawtest",
    "tests/ajpp-montant-mensuel-depassement.lawtest",
    "tests/ajpp-montant-forfait-15-bloque.lawtest",
    "tests/ajpp-montant-depassement-310-bloque.lawtest",
    "tests/ajpp-montant-duree-depassement-bloque.lawtest",
    "tests/ajpp-montant-sans-historique.lawtest",
    "tests/ajpp-montant-renouvellement-qualifie.lawtest",
    "tests/ajpp-montant-reouverture-qualifie.lawtest",
]
world = ["fr.pf.ajpp", "fr.pf.core"]

# Non-cumulation (L544-9): 2018 list vs 2025 list, part-time sick exception.
[[tests]]
family = "fr.pf.ajpp#non-cumul"
regression = false
suites = [
    "tests/ajpp-noncumul-maladie-2018.lawtest",
    "tests/ajpp-noncumul-conge.lawtest",
    "tests/ajpp-noncumul-clca.lawtest",
    "tests/ajpp-noncumul-maternite.lawtest",
