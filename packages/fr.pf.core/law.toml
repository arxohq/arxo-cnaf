# Manifest 10 - package root marker (DECISION-0033). Headers 22
# in the .law files are normative; the manifest must match them (LDC-E1109, lawc check).
[package]
name = "fr.pf.core"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:pf-core"

# Explicit package (DECISION-0386, SPEC 23.2): after .law edits run
# `law fix imports <package>`; do not maintain `use self::{...}` blocks by hand.
[authoring]
local_imports = "explicit"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). NOT semantics.
[metadata]
act = "fr-pf-core"
title = "Prestations familiales, socle commun : enfant à charge (R. 512-2, 55 % SMIC × 169 h), allocataire (L. 513-1), BMAF (L. 551-1), ressources N-2 (R. 532-3), prescription et recouvrement (L. 553-1/2), devoir de payer et sanctions"
primarySource = "CSS"
jurisdiction = "FR"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
issuer = "République française"
legalStatus = "in_force"
verifiedAgainstSource = false

[dependencies]
"fr.travail.smic" = "0.1.0"

