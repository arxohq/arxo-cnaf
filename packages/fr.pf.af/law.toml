# Manifest §10 — package root marker (DECISION-0033). Headers §22 in the
# .law files themselves are normative; the manifest must match them
# (LDC-E1109, lawc check).
[package]
name = "fr.pf.af"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:pf-af"

# Explicit package (DECISION-0386, SPEC §23.2): after .law edits run
# `law fix imports fr/pf-af`; do not maintain `use self::{…}` blocks by hand.
[authoring]
local_imports = "explicit"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). NOT semantics.
[metadata]
act = "fr-pf-af"
title = "Allocations familiales (AF)"
primarySource = "CSS"
jurisdiction = "FR"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "République française"
verifiedAgainstSource = false

[features]
enabled = ["law.params/0.1"]
semanticLayer = "L0"

# Upstream premises: child/allocataire status and the debtor body are
# established by fr.pf.core (parallel lane W1-PFCORE). Worlds below include
# both packages; cross-package institutional facts arrive as case inputs.
[dependencies]
"fr.pf.core" = "0.1.0"

# Bands, rates, counts and complément dégressif (D521-1, D521-3, D521-4,
# L521-1 bands). BMAF is a stated-assumption input in the logic scenarios
# (B-PFAF-BMAF-EURO); the D521-3 base ceilings and per-child increment are
# inputs published per year (D-81; plafond-publie-* use pinned DSS amounts,
# older scenarios keep the D521-3 amounts x their former factor); euro totals
# are illustrative of the logic, rate/band conclusions are the assertions.
# lignes-dss-* (D-83): reading ArrondiLignesDss selected in context; expected
# amounts are the rows of the pinned DSS tables (revalorisation/sources).
# tests/foreign/catala/montant-verse/* (09.10.2026): Catala 2694b17 AF cases whose
# i_montant_versé equals ours under ArrondiLignesDss with pinned BMAF/ceilings
# (test4/test10 equal to the cent: OUR exact share is pinned, see file header);
# generated by corpus/tools/foreign/catala_tests.py (tools/foreign-map.json),
# the rest is in montant-verse/diverging/*.lawtest.off (tests/foreign/catala/REPORT.md).
