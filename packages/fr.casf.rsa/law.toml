# Manifest §10 — package root marker (DECISION-0033). Normative headings per §22
# live in the .law files themselves; the manifest must match them (LDC-E1109, lawc check).
[package]
name = "fr.casf.rsa"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:rsa"

# Explicit package (DECISION-0386, SPEC §23.2): after editing .law files run
# `law fix imports fr/rsa`; do not maintain `use self::{…}` blocks by hand.
[authoring]
local_imports = "explicit"

[features]
enabled = ["law.params/0.1"]
semanticLayer = "L0"

# Catalog metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). NOT semantics.
[metadata]
act = "fr-rsa"
title = "Revenu de solidarite active (RSA): right, flat-rate amount, lone-parent increase, duties, support, suspension and recovery; wave 4"
primarySource = "CASF"
jurisdiction = "FR"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "République française; texte codifié (LEGI DILA)"
verifiedAgainstSource = false

# Upstream premises: the quarterly resources (quarter average, matrix,
# housing flat-rate) are computed by fr.minima.ressources (same wave 4
# lane W4-RSA) and arrive qualified; NOTHING owned by a neighbour package
# is redefined here. Household PF benefits counted in the matrix (AF,
# CF, ASF, PAJE base) arrive as case inputs with provenance until the
# wave-5 cascade links the PF amounts (B-RSA-PF-CASCADE).
[dependencies]
"fr.minima.ressources" = "0.1.0"

