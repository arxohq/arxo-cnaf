# Manifest §10 — package root marker (DECISION-0033). Headers §22 in the
# .law files themselves are normative; the manifest must match them
# (LDC-E1109, lawc check).
[package]
name = "fr.css.prime_activite"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:ppa"

# Explicit package (DECISION-0386, SPEC §23.2): after .law edits run
# `law fix imports fr/prime-activite`; do not maintain `use self::{…}` blocks by hand.
[authoring]
local_imports = "explicit"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). NOT semantics.
[metadata]
act = "fr-prime-activite"
title = "Prime d'activité (PA)"
primarySource = "CSS"
jurisdiction = "FR"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "République française"
verifiedAgainstSource = false

[features]
enabled = ["law.params/0.1"]
semanticLayer = "L0"

# Amounts (L.842-3, D.843-1/2/3, R.843-1 both wordings, payment floor).
[[tests]]
family = "fr.css.prime_activite#montant"
regression = false
suites = [
    "tests/prime-seul-lineaire-2026.lawtest",
    "tests/prime-seul-ancien-2025.lawtest",
    "tests/prime-couple-2e-2026.lawtest",
    "tests/prime-isole-1e-2026.lawtest",
    "tests/prime-sous-seuil-2026.lawtest",
]
world = ["fr.css.prime_activite"]

# Quarterly average (R843-1) and linear bonification (D843-2) under the readings
# PrimeMoyenneArrondieCentime / BonificationLineaireArrondieCentime (SPEC 152, D-82/D-83):
# rounded to the centime, half up; without a reading the default stays exact division.
[[tests]]
family = "fr.css.prime_activite#montant-division"
regression = false
suites = [
    "tests/prime-division-moyenne-arrondie.lawtest",
    "tests/prime-division-bonification-arrondie.lawtest",
    "tests/prime-division-chaine-arrondie.lawtest",
    "tests/prime-division-sans-lecture.lawtest",
]
world = ["fr.css.prime_activite"]

# Twelfths and thirds of non-salaried income (R845-1/2) under the reading
# RessourcesFractionsArrondiesCentime (SPEC 152, D-82/D-84): rounded to the centime, half up;
# without the reading the default stays exact division. Expectations: independent Fraction
# replica (tools/build_ressources_division.py).
[[tests]]
family = "fr.css.prime_activite#ressources-division"
regression = false
suites = [
    "tests/ressources-division-lecture.lawtest",
    "tests/ressources-division-sans-lecture.lawtest",
]
world = ["fr.css.prime_activite"]

# Flat-rate amount chain (L842-3, L161-25; DECISION-0452): decree amounts by MONTH, the
# 2022-1158 art. 9 window, the built chain under the reading
# ForfaitRevalorisationArrondiCentime, the case-supplied base. Expectations are generated
# from the pinned texts (tools/build_forfait_chaine.py).
[[tests]]
family = "fr.css.prime_activite#forfait-chaine"
regression = false
