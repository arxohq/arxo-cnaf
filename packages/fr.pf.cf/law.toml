# Manifest §10 — package root marker (DECISION-0033). Normative headings per §22
# live in the .law files themselves; the manifest must match them (LDC-E1109, lawc check).
[package]
name = "fr.pf.cf"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:pf-cf"

# Explicit package (DECISION-0386, SPEC §23.2): after editing .law files run
# `law fix imports fr/pf-cf`; do not maintain `use self::{…}` blocks by hand.
[authoring]
local_imports = "explicit"

[features]
enabled = ["law.params/0.1"]
semanticLayer = "L0"

# Catalog metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). NOT semantics.
[metadata]
act = "fr-pf-cf"
title = "Complement familial (CF): award conditions (L. 522-1, R. 522-1), ceilings (L. 522-2, R. 522-2, R. 522-4), amounts (D. 522-1, D. 522-2, L. 522-3) and differential (R. 522-3), fund payment duty; wave 3"
primarySource = "CSS"
jurisdiction = "FR"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "République française"
verifiedAgainstSource = false

[dependencies]
"fr.css.pass" = "0.1.0"
"fr.pf.core" = "0.1.0"

# Own families (DECISION-0127): regression = false until the ratchet is registered.
[[tests]]
family = "fr.pf.cf#conditions"
regression = false
suites = [
    "tests/conditions-trois-enfants.lawtest",
    "tests/conditions-deux-enfants.lawtest",
    "tests/conditions-vingt-et-un-an.lawtest",
    "tests/conditions-vingt-ans-remunere.lawtest",
    "tests/conditions-biactif.lawtest",
    "tests/conditions-non-biactif.lawtest",
]
world = ["fr.pf.cf", "fr.pf.core", "fr.css.pass"]

