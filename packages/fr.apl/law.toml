# Манифест §10 — маркер корня пакета (DECISION-0033). Нормативны заголовки §22
# в самих .law; манифест обязан с ними совпадать (LDC-E1109, lawc check).
[package]
name = "fr.apl"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:apl"

# Каталожная метадата (DECISION-0051). НЕ семантика.
[metadata]
act = "fr-apl"
title = "Aide personnelle au logement, secteur locatif: расчёт месячного пособия по D. 823-16 и D. 823-17 CCH и главе III приказа от 27.09.2019 — плафоны найма по зонам, форфейт расходов, участие P0 и Tp, дегрессивность, минорация, вилка взносов и порог выплаты; две редакции барема (01.10.2020 и 01.10.2021 с R0 от 01.01.2022); срез ресурсов R. 822-2…18 и деонтический слой выплаты (модули 08–09)"
primarySource = "CCH"
jurisdiction = "FR"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "République française; текст кодифицирован, барем установлен приказом министров, ответственных за жильё, здравоохранение и бюджет"
verifiedAgainstSource = false

[features]
enabled = ["law.params/0.1"]
semanticLayer = "L0"

# Раздел 2 главы II (ресурсы, R. 822-3/4/13/17): вертикальный срез 15.09.2026,
# налоговая квалификация зарплаты/пособия по безработице — отдельный пакет.
[dependencies]
"fr.tax.income_for_apl" = "0.1.0"

