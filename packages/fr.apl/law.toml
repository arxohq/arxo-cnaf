# Меблированный наём (D-85, 09.10.2026): D. 842-1/D. 842-2 CCH (AL) и последний
# абзац D. 823-18 (APL с 11.01.2020) — loyer principal равен двум третям уплаченной
# цены; две трети не конечной дробью — под прочтением D-82 до сантима HALF_UP.
# Ожидания — из независимой реплики на дробях по закреплённому барему.
[[tests]]
family = "fr.apl#meuble"
regression = false
suites = [
    "tests/meuble-d842-2.lawtest",
]
world = ["fr.apl"]
# Границы самого пакета: плафон, R0, порог выплаты, ось редакций,
