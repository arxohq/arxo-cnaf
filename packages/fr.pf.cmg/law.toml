# Manifest §10 — package root marker (DECISION-0033). Normative headings per §22
# live in the .law files themselves; the manifest must match them (LDC-E1109, lawc check).
[package]
name = "fr.pf.cmg"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:pf-cmg"

# Explicit package (DECISION-0386, SPEC §23.2): after editing .law files run
# `law fix imports <package>`; do not maintain `use self::{…}` blocks by hand.
[authoring]
local_imports = "explicit"

[features]
enabled = ["law.params/0.1"]
semanticLayer = "L0"

# Catalog metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). NOT semantics.
[metadata]
act = "fr-pf-cmg"
title = "CMG, complément de libre choix du mode de garde: right, 2025 reform formula (hourly cap, reference cost, effort rate), old scale, structure aid, cumulation, shared residence; wave 3"
primarySource = "CSS"
jurisdiction = "FR"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "République française; texte codifié (LEGI DILA)"
verifiedAgainstSource = true

# Upstream premises: child in care and the debtor body are established by
# fr.pf.core (parallel lane W1-PFCORE). Worlds below include both
# packages; cross-package institutional facts arrive as case inputs.
[dependencies]
"fr.pf.core" = "0.1.0"

# Own families (DECISION-0127): regression = false until the ratchet is registered.
[[tests]]
family = "fr.pf.cmg#formule"
regression = false
suites = [
    "tests/cm-formule-assmat.lawtest",
    "tests/cm-formule-domicile.lawtest",
    "tests/cm-formule-plafond-atteint.lawtest",
    "tests/cm-formule-plancher.lawtest",
    "tests/cm-formule-taux-enfants.lawtest",
    "tests/cm-formule-aeeh.lawtest",
]
world = ["fr.pf.cmg", "fr.pf.core"]

[[tests]]
family = "fr.pf.cmg#ancien-bareme"
regression = false
suites = [
    "tests/cm-ancien-bande1.lawtest",
