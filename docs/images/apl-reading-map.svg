<svg xmlns="http://www.w3.org/2000/svg" width="840" height="716" viewBox="0 0 840 716" role="img" aria-labelledby="title desc">
<title id="title">One APL case, two selected readings</title>
<desc id="desc">A shortened rule map for the zero-rent scenario dated 15 June 2024. Shared facts and derived parameters feed SensMinimumPp. PpPlancherFinal includes ParticipationPersonnelle and yields Pp 37.91 euros; PpLitteral includes ParticipationPersonnelleLitterale and yields Pp 4.3462 euros. Both feed AideFormule, anchored to D. 823-16. Formula amounts: 20.17 or 53.7338 euros. Without a selection, the queries report INTERPRETATION_REQUIRED. This is not a full execution proof.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.head{font-size:26px;font-weight:700}.body{font-size:19px}.small{font-size:16px}.mono{font-family:monospace;font-size:18px}.rule{font-family:monospace;font-size:16px}.value{font-size:26px;font-weight:700;fill:#1a3fa9}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2454db"/></marker></defs>
<rect width="840" height="716" rx="16" fill="#f3f6fc"/>
<text x="32" y="43" class="head">One APL case, two readings</text>
<text x="32" y="73" class="body">15 June 2024 · zero-rent probe · fr.apl@0.1.0</text>
<rect x="32" y="94" width="776" height="88" rx="12" fill="#fff" stroke="#dce4f0"/>
<text x="52" y="122" class="body">Shared case facts and derived parameters</text>
<text x="52" y="148" class="mono">P0 €37.91 · Tp 0.0283 · R €4,000 · R0 €5,186</text>
<text x="52" y="171" class="small">Selected values from finish-lecture-pp.lawtest; L = €0, C = €58.08</text>
<path d="M420 182 V206" stroke="#2454db" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="170" y="212" width="500" height="72" rx="12" fill="#e8efff"/>
<text x="420" y="239" text-anchor="middle" class="mono">SensMinimumPp · D. 823-17</text>
<text x="420" y="265" text-anchor="middle" class="body">Choose exactly one reading</text>
<path d="M300 284 V303 H218 V320" stroke="#2454db" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<path d="M540 284 V303 H622 V320" stroke="#2454db" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="32" y="326" width="372" height="151" rx="12" fill="#fff" stroke="#dce4f0"/>
<rect x="436" y="326" width="372" height="151" rx="12" fill="#fff" stroke="#dce4f0"/>
<text x="52" y="355" class="mono">PpPlancherFinal</text>
<text x="52" y="382" class="rule">ParticipationPersonnelle</text>
<text x="52" y="409" class="body">max(P0, P0 + Tp × (R − R0))</text>
<text x="52" y="451" class="value">Pp = €37.91</text>
<text x="456" y="355" class="mono">PpLitteral</text>
<text x="456" y="382" class="rule">ParticipationPersonnelleLitterale</text>
<text x="456" y="409" class="body">P0 + Tp × (R − R0)</text>
<text x="456" y="451" class="value">Pp = €4.3462</text>
<path d="M218 477 V498 H420 M622 477 V498 H420 V521" stroke="#2454db" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="170" y="527" width="500" height="105" rx="12" fill="#e8efff"/>
<text x="420" y="555" text-anchor="middle" class="mono">AideFormule · D. 823-16</text>
<text x="420" y="583" text-anchor="middle" class="body">Af = L + C − Pp</text>
<text x="420" y="615" text-anchor="middle" class="value">€20.17 or €53.7338</text>
<text x="32" y="665" class="mono">No reading: INTERPRETATION_REQUIRED</text>
<text x="32" y="693" class="small">Selected rule structure with scenario expectations; not a full execution proof.</text>
</svg>