<svg xmlns="http://www.w3.org/2000/svg" width="600" height="740" viewBox="0 0 600 740" role="img" aria-labelledby="title desc">
<title id="title">APL formula amounts under two explicit readings and no selection</title><desc id="desc">For the same zero-rent probe on 15 June 2024, PpPlancherFinal returns COMPUTED EUR 20.17; PpLitteral returns COMPUTED EUR 53.7338; without selection the status is INTERPRETATION_REQUIRED and no amount is returned.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#215983"/></marker></defs>
<rect width="600" height="740" rx="14" fill="#ffffff"/>
<text x="24" y="43" font-size="30" font-weight="700" fill="#112f50">Same facts. Explicit reading.</text>
<text x="24" y="82" font-size="22" font-weight="400" fill="#425d78">The shipped APL zero-rent probe</text>
<text x="24" y="116" font-size="20" font-weight="400" fill="#425d78">Legal date: 2024-06-15</text>
<rect x="24" y="146" width="552" height="145" rx="12" fill="#e6f4ee"/>
<text x="44" y="183" font-size="23" font-weight="600" fill="#112f50" class="mono">PpPlancherFinal</text>
<text x="44" y="221" font-size="20" font-weight="600" fill="#0b6e4f" class="mono">COMPUTED</text>
<text x="44" y="265" font-size="31" font-weight="750" fill="#0b6e4f">20.17 EUR</text>
<rect x="24" y="310" width="552" height="145" rx="12" fill="#e6f4ee"/>
<text x="44" y="347" font-size="23" font-weight="600" fill="#112f50" class="mono">PpLitteral</text>
<text x="44" y="385" font-size="20" font-weight="600" fill="#0b6e4f" class="mono">COMPUTED</text>
<text x="44" y="429" font-size="31" font-weight="750" fill="#0b6e4f">53.7338 EUR</text>
<rect x="24" y="474" width="552" height="145" rx="12" fill="#fff4df"/>
<text x="44" y="511" font-size="23" font-weight="600" fill="#112f50">No selected interpretation</text>
<text x="44" y="549" font-size="20" font-weight="600" fill="#83500c" class="mono">INTERPRETATION_REQUIRED</text>
