<svg xmlns="http://www.w3.org/2000/svg" width="600" height="680" viewBox="0 0 600 680" role="img" aria-labelledby="title desc">
<title id="title">From a pinned model to an answer with evidence</title><desc id="desc">loadModel returns one hash-checked linked world. Explicit facts, dates and readings enter separately as caseInput. The common SDK opens that world offline and asks aide_formule. The supplied APL probe returns a computed EUR 20.17 formula amount, with its canonical document, proof, sources and hashes.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#215983"/></marker></defs>
<rect width="600" height="680" rx="14" fill="#ffffff"/>
<text x="24" y="45" font-size="31" font-weight="700" fill="#112f50">From model to answer</text>
<rect x="24" y="80" width="264" height="144" rx="12" fill="#f4f7fa"/>
<rect x="312" y="80" width="264" height="144" rx="12" fill="#f4f7fa"/>
<text x="42" y="117" font-size="24" font-weight="650" fill="#215983" class="mono">loadModel()</text>
<text x="42" y="151" font-size="23" font-weight="600" fill="#112f50">Selected world</text>
<text x="42" y="184" font-size="20" font-weight="400" fill="#425d78">Included imports</text>
<text x="42" y="211" font-size="20" font-weight="400" fill="#425d78">Checked raw bytes</text>
<text x="330" y="117" font-size="24" font-weight="650" fill="#215983" class="mono">caseInput</text>
<text x="330" y="151" font-size="23" font-weight="600" fill="#112f50">Explicit inputs</text>
<text x="330" y="184" font-size="20" font-weight="400" fill="#425d78">Facts + dates</text>
<text x="330" y="211" font-size="20" font-weight="400" fill="#425d78">Selected reading</text>
<path d="M156 230 L156 260 L270 260 L270 296" fill="none" stroke="#215983" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M444 230 L444 260 L330 260 L330 296" fill="none" stroke="#215983" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="24" y="308" width="552" height="149" rx="12" fill="#eaf0f7"/>
<text x="48" y="345" font-size="27" font-weight="650" fill="#215983" class="mono">@arxo/law</text>
<text x="48" y="382" font-size="23" font-weight="500" fill="#112f50" class="mono">open(... local.packages)</text>
<text x="48" y="418" font-size="23" font-weight="500" fill="#112f50" class="mono">collect('aide_formule', ...)</text>
<text x="48" y="447" font-size="20" font-weight="400" fill="#425d78">Local WebAssembly execution</text>
<path d="M300 464 L300 492" fill="none" stroke="#215983" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="24" y="506" width="552" height="145" rx="12" fill="#e6f4ee"/>
<text x="48" y="546" font-size="23" font-weight="650" fill="#0b6e4f" class="mono">COMPUTED</text>
<text x="552" y="548" text-anchor="end" font-size="27" font-weight="750" fill="#0b6e4f">20.17 EUR</text>
<text x="48" y="587" font-size="22" font-weight="500" fill="#0b6e4f">document · proof · sources · hashes</text>
<text x="48" y="627" font-size="20" font-weight="400" fill="#0b6e4f">46 proof nodes in the shipped example</text>
</svg>
