name: public package scope
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 tools/public_scope.py --packages packages --check
